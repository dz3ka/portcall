name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # portcall runs on someone else's locked-down laptop, so every check runs on
    # all three host OSes. That includes the no-writes guardrail test, which is a
    # normal vitest test and only means something against a real filesystem.
    strategy:
      fail-fast: false # a Windows-only failure must not hide a macOS one
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # floating 22.x; resolves above the >=22.18.0 engines floor,
          # which is where Node turned on TypeScript type-stripping by default. The
          # test suite and the PAC worker load .ts files directly, so a literal 22.6
          # would fail to boot the tool at all.
          cache: npm
      # bun is installed here even though `verify` builds no binaries. ADR-0031
      # stakes the project on one claim - the same chain gets the same verdict
      # under Node and under the bun-compiled binary - and
      # test/net-root-bundle.test.ts measures it by running the same module
      # under both runtimes. Without bun on PATH that assertion skips, and it
      # was skipping on every runner and every laptop, which meant the claim the
      # tool is sold on was executing nowhere. Same pinned commit as the
      # `binaries` job below, for the same reason it is pinned there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: npm ci
      # One step delegating to the repo's own script, so what CI runs and what a
      # developer runs locally cannot drift apart.
      - name: verify (profiles:check, lint, typecheck, test)
        run: npm run verify

  truststore-proof:
    # The claim `truststore.node.missing-root` makes - "this machine trusts a
    # root Node does not" - proven against a *real* injected root on each real
    # OS, not a fixture (M4, WP7, SPEC.md §7). A dedicated job, not a step
    # inside `verify`: a red `truststore-proof (macos-latest)` names the exact
    # claim that broke, where a red `verify (macos-latest)` would not
    # distinguish "the probe is wrong" from "eslint is unhappy" on that runner.
    #
    # The injected root is a throwaway, generated fresh by
    # `generate-root.mjs` on every run (test/helpers/synthetic-chain.ts, no
    # openssl, no vendored key) and mutates only this disposable runner's
    # machine trust store - never this repo's working directory, and never a
    # developer's own machine (CLAUDE.md's no-config-mutation rule is about the
    # tool under test, not this harness).
    strategy:
      fail-fast: false # a Windows-only failure must not hide a macOS one
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `${{ runner.temp }}` rather than the raw `RUNNER_TEMP` env var name:
      # GitHub sets the context expression identically under bash and pwsh
      # steps, where the env var's own shell syntax would differ
      # ($RUNNER_TEMP vs $env:RUNNER_TEMP).
      - name: generate the throwaway root and export its SHA-256
        # shell: bash is required here - the Windows runner's default shell is
        # pwsh, where bare `$GITHUB_ENV` is an unset local variable (not the
        # env var) and `>> "$GITHUB_ENV"` silently redirects to nowhere,
        # leaving PORTCALL_TEST_ROOT_SHA256 unset and the gate permanently
        # throwing on that leg. bash (Git Bash, present on GitHub-hosted
        # Windows runners) expands $GITHUB_ENV correctly on all three OSes.
        shell: bash
        run: node test/truststore-injected/generate-root.mjs "${{ runner.temp }}" >> "$GITHUB_ENV"
      # Three injection commands, one per OS - the whole reason this job is a
      # matrix rather than one Linux run. Each step is gated to its own OS so
      # the log for a given runner shows exactly the command that ran on it.
      - name: inject the root (ubuntu - update-ca-certificates)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo cp "${{ runner.temp }}/root.pem" /usr/local/share/ca-certificates/portcall-m4.crt
          sudo update-ca-certificates
      - name: inject the root (macos - security add-trusted-cert)
        if: matrix.os == 'macos-latest'
        run: |
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "${{ runner.temp }}/root.cer"
      - name: inject the root (windows - Import-Certificate)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Import-Certificate -FilePath "${{ runner.temp }}\root.cer" -CertStoreLocation Cert:\LocalMachine\Root
      - name: npm run test:truststore (against the real, injected trust store)
        run: npm run test:truststore

  node-compat:
    # Only the majors package.json claims to support (engines.node >=22.6.0).
    # Node 20 is deliberately absent: a green run on a version the package
    # declares unsupported is a false assurance, not extra coverage.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The built CLI must produce a report in every format it advertises, so
      # each format is checked for one string only that format can produce.
      # Exit status alone would not do it: at M0 no probes are registered, so a
      # renderer emitting an empty string - or --format html silently falling
      # back to text - would pass green.
      # Output is left in the log on purpose: the shipped profile names only
      # public vendor endpoints, so there is nothing here to redact.
      - name: check --profile generic-ai-tool in every report format
        run: |
          for format in text json html; do
            report="$RUNNER_TEMP/report.$format"
            echo "::group::format=$format"
            node dist/cli/index.js check --profile generic-ai-tool --format "$format" | tee "$report"
            echo "::endgroup::"
            case "$format" in
              text) grep -q '^portcall ' "$report" ;;
              json) jq -e '.schemaVersion' "$report" >/dev/null ;;
              html) grep -qi '^<!doctype html' "$report" ;;
            esac || { echo "::error::--format $format did not produce a $format report"; exit 1; }
          done

  harness:
    # The hostile-network harness (SPEC.md §10, ADR-0025): mitmproxy re-signing
    # with a generated root, squid demanding Basic auth, a resolver answering
    # split-horizon, and a proxy that will not tunnel. The suite runs *inside*
    # that network and asserts portcall names each condition.
    #
    # ubuntu-only, and not for convenience: the GitHub Windows and macOS runners
    # have no Linux Docker daemon, so a matrix here would be three jobs of which
    # two could never run. What the other two OSes are needed for - trust stores
    # and filesystem behaviour - is covered by the `verify` matrix above, and
    # nothing about a proxy re-signing TLS is host-OS dependent.
    runs-on: ubuntu-latest
    timeout-minutes: 20 # five containers and an image build: fail, don't hang
    steps:
      - uses: actions/checkout@v7
      # `--wait` is the readiness mechanism, so there is no sleep anywhere in
      # this job or in the suite. Compose blocks until every healthcheck passes;
      # mitmproxy's proves its generated CA is on disk, which a bare port check
      # would not (it binds the listener before writing the root).
      - name: bring up the hostile network
        run: docker compose -f test/harness/docker-compose.yml up --wait
      # The image bakes the repo with `COPY . .` and nothing is bind-mounted, so
      # the image has to postdate the checkout. `up --wait` builds it when no
      # image exists at all, which is always true on a fresh runner - so this
      # job was right by accident, not wrong. It is stated explicitly because
      # "always true on a fresh runner" is a property of the runner, not of this
      # workflow, and `scripts/demo.mjs` runs the same four commands in the same
      # order for the same reason.
      - name: build the portcall image against this checkout
        run: docker compose -f test/harness/docker-compose.yml build portcall
      # `run` and not `exec`: the suite is profile-gated in the compose file so
      # that `up --wait` never starts it, and `run --rm` propagates vitest's
      # exit code as this step's.
      - name: npm run test:integration (inside the harness network)
        run: docker compose -f test/harness/docker-compose.yml run --rm portcall
      # A red harness run is worthless without the other side of the
      # conversation - "the tunnel returned 502" is a mitmproxy log line, not a
      # portcall finding. Logs only on failure, so a green run stays readable.
      - name: service logs
        if: failure()
        run: docker compose -f test/harness/docker-compose.yml logs --no-color --timestamps
      # `-v` removes the mitmproxy CA volume too: the next run must generate a
      # fresh root, because a stale one would let the cold-start path rot
      # untested. `always()` so a failing suite still tears the network down.
      - name: tear down
        if: always()
        run: docker compose -f test/harness/docker-compose.yml down -v --remove-orphans

  demo:
    # The recording that SPEC.md §11 asks for, rendered rather than screen-
    # captured by hand: `demo/portcall-demo.tape` drives `npm run demo`, which
    # is a real `portcall check` inside the harness network above (ADR-0046).
    #
    # A dedicated job for the same reason `truststore-proof` is one: a red
    # `demo` names the exact claim that broke - "one command shows the product
    # naming what is wrong with this network" - where the same failure folded
    # into `harness` would read as the integration suite going red.
    #
    # ubuntu-only for the reason `harness` is: the Windows and macOS runners
    # have no Linux Docker daemon, and there is nothing host-OS dependent about
    # a recording.
    runs-on: ubuntu-latest
    # 35, not `harness`'s 20: this job pays for two full compose cycles - the
    # assertion step below, and a second one the tape drives inside the render.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      # No setup-node and no `npm ci`, same as `harness`: the demo shells out to
      # `docker compose`, and the product is built and run inside the container.
      # The runner's own node is only what executes the 200-line script.
      #
      # THIS step is the assertion, and it is why it comes first. `vhs` exits 0
      # whether the command it recorded succeeded or failed, so a job whose only
      # step were the render below would publish a GIF of a stack trace under a
      # green tick - the "green until it matters" shape. Running the demo on its
      # own first means a broken demo reddens CI here, on ADR-0046's exit-2
      # assertion, and the tape step is left doing only what it is good at.
      - name: npm run demo (the assertion; the render below asserts nothing)
        run: node scripts/demo.mjs
      # Pinned to a commit like `oven-sh/setup-bun` above, and for the same
      # reason: third-party action, mutable tag.
      #
      # `install-fonts` because a bare runner has no font matching the tape's
      # default family, and fontconfig's substitute is whatever it happens to
      # pick that day - which changes the glyph metrics, and so the frames,
      # between runs of an identical tape.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: demo/portcall-demo.tape
          install-fonts: true
      # The artifact is the deliverable of this job. It is *not* compared
      # against `demo/portcall-demo.gif` in the repo: frame timing here depends
      # on how long Docker took, so a diff would flake on every run and teach
      # everyone to ignore it. The committed GIF is a hand-refreshed snapshot of
      # one of these artifacts, and is described that way where it is embedded
      # (ADR-0047).
      - uses: actions/upload-artifact@v7
        with:
          name: portcall-demo-gif
          path: demo/portcall-demo.gif
          if-no-files-found: error

  binaries:
    # bun cross-compiles all five targets from a single runner (ADR-0001), so
    # this job is not a matrix. bun is a build-time dependency only; nothing on
    # a customer's machine ever needs it.
    runs-on: ubuntu-latest
    timeout-minutes: 20 # first real exercise of the compile path: fail, don't hang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Pinned to a commit, not the mutable v2 tag: every third-party action
      # here is pinned to a commit, never a tag, because a tag repoint would run
      # someone else's code in the release build. The actions/* steps above are
      # GitHub-owned.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: npm ci
      # Print the plan (targets, bun argv, output paths) before compiling, so a
      # failure below can be read against the exact command that produced it.
      - name: build plan
        run: node scripts/build-binaries.mjs --dry-run
      - run: npm run build:binaries
      - uses: actions/upload-artifact@v7
        with:
          name: portcall-binaries
          # A glob, not the five filenames: artifact names belong to the build
          # script, and CI should not need editing when one of them changes.
          path: build/binaries/**
          if-no-files-found: error
