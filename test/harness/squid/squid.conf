# Basic auth, required for everything, with no anonymous path anywhere.
#
# `basic_ncsa_auth` is the simplest helper that produces a real
# `Proxy-Authenticate: Basic realm="..."` header, which is the byte sequence the
# proxy probe classifies (`src/probes/proxy/auth.ts`). The realm is deliberately
# wordy: it shows up verbatim in the finding evidence, so a reader of a failing
# test can see which service produced the challenge.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm portcall harness squid - authentication required
auth_param basic children 2
auth_param basic credentialsttl 1 minute

acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl CONNECT method CONNECT

# Order matters: the deny for unauthenticated requests has to come before any
# allow, or squid answers 403 and the harness plants the wrong condition.
http_access deny !authenticated
http_access allow authenticated
http_access deny all

http_port 3128

# No cache, no store, no logs that outlive the container: this is a challenge
# generator, not a proxy anybody is meant to get through.
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
