# TLS on 443 and nothing else. There is no plaintext listener: an endpoint that
# also answers on 80 would let a scenario pass for the wrong reason.
server {
    listen 443 ssl;
    http2 on;
    server_name api.anthropic.com registry.npmjs.org origin;

    ssl_certificate     /etc/nginx/pki/chain.crt;
    ssl_certificate_key /etc/nginx/pki/leaf.key;
    # 1.2 as the floor, matching the shipped profile's `tls.min_version`. The
    # harness is not trying to provoke `tls.protocol-below-minimum`; that class
    # is covered by the recorded-chain fixtures, which can hold a protocol
    # string no live OpenSSL will still negotiate.
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        add_header Content-Type text/plain;
        return 200 "portcall harness origin\n";
    }
}
