# The appliance that will not tunnel.
#
# nginx cannot service a CONNECT at all: its request-line parser rejects the
# `host:port` target form and answers `400`, before any location block is
# consulted. That is precisely the behaviour of a corporate proxy whose policy
# permits CONNECT to 443 and refuses every other port - the client gets a
# non-2xx response to its tunnel request and no tunnel - and it is what
# `classifyConnect` turns into `proxy.connect-rejected`, which is a different
# finding from `proxy.auth-required` and a different ticket for a different
# team.
#
# The harness only ever aims a *non-443* CONNECT at this listener; the
# harness profile's `registry.npmjs.org:8080` endpoint exists for that. Being
# honest about the limitation: nginx would refuse a CONNECT to 443 here too,
# so the "non-443" half of the condition is enforced by which target the suite
# routes through this proxy, not by the proxy itself. A stand-in that could
# tunnel 443 and refuse the rest would have to be a second real proxy, which
# would test squid's code path twice and prove nothing new.
server {
    listen 8888;
    server_name nginx-proxy;

    # Only so the container has a readiness signal - a CONNECT cannot be one,
    # because failing the CONNECT is the service's entire job.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Content-Type text/plain;
        return 403 "this proxy does not tunnel\n";
    }
}
