# The split-horizon zone (SPEC.md §7 - "public host resolving to RFC1918").
#
# `no-resolv` and `no-hosts` make this resolver hermetic: it forwards nothing
# upstream and reads no host file, so every answer below is an answer this file
# put there. That is what makes the harness's DNS condition a plant rather than
# an accident of whatever resolver the build machine happened to have.
no-resolv
no-hosts
log-queries

# The planted split horizon. These are real public names - they are the names
# the shipped profile uses - and inside this network they answer with an RFC1918
# address belonging to the harness origin. A public name answering privately is
# exactly `dns.split-horizon`, and it is also how a transparent interception
# appliance inserts itself.
address=/api.anthropic.com/10.31.0.20
address=/registry.npmjs.org/10.31.0.20

# Service names. Docker's embedded resolver is bypassed for every container that
# points `dns:` here, so this file has to carry the network's own names too -
# the addresses match the static `ipv4_address` assignments in docker-compose.yml
# and are duplicated on purpose, so a reader can check them against each other.
host-record=dns,10.31.0.53
host-record=origin,10.31.0.20
host-record=mitmproxy,10.31.0.30
host-record=squid,10.31.0.40
host-record=nginx-proxy,10.31.0.50
